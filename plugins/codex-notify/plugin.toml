[plugin]
name = "codex-notify"
version = "1.0.0"
api_version = 1
description = "Advisory journal notifications to one Codex chat per run"

[hooks.pre_run]
cmd = 'python3 "{scripts}/notify.py" launch'
timeout_sec = 5
blocking = false
fail_closed = false

[[settings]]
key = "thread_id"
type = "str"
default = ""
help = "Destination Codex chat; CODEX_NOTIFY_THREAD_ID overrides this for a new run"

[[settings]]
key = "codex_path"
type = "str"
default = "codex"
help = "Codex executable; CODEX_NOTIFY_CODEX_PATH overrides this for a new run"
